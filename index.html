<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>REPORTE MANTENIMIENTO PREVENTIVO ATP</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-dark: #065f46;
      --secondary: #334155;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      background: #0f172a; color: #fff; padding: 14px 16px;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 50;
    }
    header h1 { font-size: 0.95rem; font-weight: 700; letter-spacing: 0.3px; }
    .version { font-size: 0.78rem; background: #1e293b; padding: 3px 8px; border-radius: 6px; color: #94a3b8; }
    .container { max-width: 720px; margin: 0 auto; padding: 14px; }
    .create-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .create-box input {
      flex: 1; min-width: 200px; padding: 11px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 0.95rem; outline: none;
    }
    .create-box input:focus { border-color: var(--primary); }
    button {
      border: none; border-radius: 8px; padding: 10px 14px; font-size: 0.88rem;
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    button:active { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: var(--secondary); color: #fff; }
    .btn-outline { background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; }
    .btn-danger { background: #fee2e2; color: var(--danger); }
    .project-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; margin-bottom: 12px;
    }
    .project-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .project-title { font-size: 1.05rem; font-weight: 700; color: var(--text); word-break: break-word; }
    .progress-badge {
      font-size: 0.8rem; font-weight: 700; padding: 3px 8px; border-radius: 99px;
      background: #e2e8f0; color: var(--text); white-space: nowrap;
    }
    .progress-badge.done { background: var(--primary-dark); color: #fff; }
    .progress-bar-bg { width: 100%; height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar-fill { height: 100%; background: var(--primary); transition: width 0.25s; }
    .progress-bar-fill.done { background: var(--primary-dark); }
    .project-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .project-actions button { flex: 1; min-width: 85px; padding: 8px 10px; font-size: 0.82rem; }
    .nav-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: var(--card); border: 1px solid var(--border); padding: 10px 12px;
      border-radius: 10px; margin-bottom: 12px;
    }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
    .tab-btn {
      flex: 1; background: #e2e8f0; color: var(--text); padding: 10px 8px;
      font-size: 0.8rem; border-radius: 8px; text-align: center;
    }
    .tab-btn.active { background: #0f172a; color: #fff; }
    .sub-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
    }
    .sub-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .sub-title { font-size: 0.92rem; font-weight: 700; }
    .sub-count { font-size: 0.75rem; padding: 2px 7px; border-radius: 6px; background: #f1f5f9; color: var(--muted); white-space: nowrap; }
    .sub-count.has-files { background: #ccfbf1; color: var(--primary-dark); font-weight: 700; }
    .sub-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; line-height: 1.3; }
    .sub-btns { display: flex; gap: 8px; }
    .sub-btns button { flex: 1; padding: 9px; font-size: 0.85rem; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-top: 10px; }
    .thumb-item {
      position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
      border: 1px solid var(--border); background: #f1f5f9; display: flex; align-items: center; justify-content: center;
    }
    .thumb-item img, .thumb-item video { width: 100%; height: 100%; object-fit: cover; }
    .thumb-pdf { font-size: 0.72rem; font-weight: 700; text-align: center; padding: 4px; color: #b91c1c; }
    .thumb-del {
      position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; padding: 0;
      border-radius: 50%; background: rgba(220,38,38,0.92); color: #fff; font-size: 14px; line-height: 1;
    }
    #toast {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 8px;
      font-size: 0.85rem; z-index: 200; display: none; max-width: 90%; text-align: center;
    }
    /* Viewer Modal */
    #viewerModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 150;
      display: none; flex-direction: column; justify-content: space-between;
    }
    .viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: #fff; }
    .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .viewer-body img, .viewer-body video { max-width: 100%; max-height: 80vh; object-fit: contain; }
    .viewer-nav {
      position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2);
      color: #fff; font-size: 1.5rem; width: 42px; height: 42px; border-radius: 50%;
    }
    .viewer-prev { left: 10px; }
    .viewer-next { right: 10px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>REPORTE MANTENIMIENTO PREVENTIVO ATP</h1>
    <span class="version">v15.9 ∞</span>
  </header>

  <div class="container">
    <!-- HOME VIEW: SOLO CARPETAS PRINCIPALES -->
    <div id="homeView">
      <div class="create-box">
        <input type="text" id="newProjectName" placeholder="NOMBRE SITE Y FECHA_10.10.26" />
        <button class="btn-primary" id="btnCreateProject">+ Crear Carpeta</button>
      </div>
      <div id="projectsList"></div>
    </div>

    <!-- PROJECT DETAIL VIEW -->
    <div id="projectView" class="hidden">
      <div class="nav-bar">
        <button class="btn-outline" id="btnBackHome">← Carpetas</button>
        <div style="flex:1; min-width:0; padding:0 6px;">
          <div id="activeProjectTitle" style="font-weight:700; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
          <div id="activeProjectStats" style="font-size:0.78rem; color:var(--muted);"></div>
        </div>
        <button class="btn-secondary" id="btnQuickZip" style="padding:8px 10px; font-size:0.8rem;">ZIP</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="f17">1. F17-CARPETA DE FOTOS</button>
        <button class="tab-btn" data-tab="formatos">2. FORMATOS MP</button>
        <button class="tab-btn" data-tab="mp">3. MANTENIMIENTO PREVENTIVO</button>
      </div>

      <div id="subfoldersList"></div>
    </div>
  </div>

  <!-- Hidden inputs for native camera burst & gallery -->
  <input type="file" id="nativeCamInput" accept="image/*" capture="environment" class="hidden" />
  <input type="file" id="galleryInput" multiple class="hidden" />

  <!-- Fullscreen Carousel Viewer -->
  <div id="viewerModal">
    <div class="viewer-top">
      <span id="viewerCounter" style="font-size:0.85rem;"></span>
      <div style="display:flex; gap:8px;">
        <button class="btn-danger" id="viewerDeleteBtn" style="padding:6px 10px; font-size:0.8rem;">Eliminar</button>
        <button class="btn-outline" id="viewerCloseBtn" style="padding:6px 10px; font-size:0.8rem;">Cerrar</button>
      </div>
    </div>
    <div class="viewer-body" id="viewerTouchArea">
      <button class="viewer-nav viewer-prev" id="viewerPrevBtn">‹</button>
      <div id="viewerContent"></div>
      <button class="viewer-nav viewer-next" id="viewerNextBtn">›</button>
    </div>
    <div id="viewerName" style="color:#cbd5e1; text-align:center; padding:10px; font-size:0.8rem;"></div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
